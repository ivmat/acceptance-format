# acceptance/troubleshooting example pair (0.1.0 revision) -- the INVALID half.
# Claims isolate_fault_domain from diagnostic-structure evidence ALONE ("logging exists": a static
# correlation/schema check, PROFILE.md Meaning/§4/§6) -- rejected: structure alone cannot show
# diagnosis (C-T6), and separately rejected by C-T7 (no blind-diagnosis evidence record backs an
# outcome above 'detect'). Otherwise identical to valid.acceptance.toml.

[format]
id      = "acceptance/0"
profile = "acceptance/troubleshooting"

[subject]
name   = "example-troubleshooting-subject"
kind   = "tool"
commit = "0000000000000000000000000000000000000000"
dirty  = false

[spec]
path    = "SPEC.md"
version = "v1"

[coverage]
clauses_total = 1
claims_total  = 1

[diagnostics]
privacy   = "no personal data"
retention = "repo lifetime"
sampling  = "100% (every scenario)"

[[claim]]
id          = "TS-EX-1"
clause      = "example-fault"
item        = "example::diagnose"
statement   = "structural correlation-field checks alone are claimed to isolate the fault domain of example-fault (floor band A0)"
fault_class      = "example-fault"
outcome          = "isolate_fault_domain"
outcome_criterion = { granularity = "example-domain", grading = "exact-set" }
scenario_source   = { rule = "example:: every named scenario (synthetic, not a real generator)", population = 2 }
scenarios   = ["s1", "s2"]
status      = "evidenced"
grade       = "ungraded"

  [[claim.evidence]]
  kind           = "diagnostic-structure-check"
  family         = "diagnostic-structure"
  ref            = "example::correlation-fields-present"
  result         = "pass"
  tool           = "example-schema-check@0"
  record         = "evidence/results.json"
  record_hash    = "record:sha-512:be7b8539ec0ed698eeb60251a8e59959330a5f1e35f970611ff7eaa507fd936ca550b66e96726f8eaaf3a8ec2c6efe6e4996b941368bfbff5d63532ce74b3836"
  epistemic_tier = "T4"
