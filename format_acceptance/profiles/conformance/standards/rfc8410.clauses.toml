[standard]
id         = "rfc8410"
title      = "RFC 8410 (08/2018) — Algorithm Identifiers for Ed25519, Ed448, X25519, and X448"
edition    = "2018-08"
provenance = "external"
slice      = true
slice_note = "the public-key AlgorithmIdentifier, public-key encoding, and private-key encoding clauses (§3, §4, §7) this crate's key parsers can conform to or violate"
numbering  = "the standard's own clause numbers"

[[clause]]
id    = "RFC8410-3"
ref   = "§3"
title = "public key AlgorithmIdentifier carries no parameters"
force = "shall"
side  = "both"

[[clause]]
id    = "RFC8410-4"
ref   = "§4"
title = "subjectPublicKey encodes raw public key octets directly"
force = "definition"
side  = "both"

[[clause]]
id    = "RFC8410-7"
ref   = "§7"
title = "private key CurvePrivateKey nested inside PKCS#8 OCTET STRING"
force = "definition"
side  = "both"
