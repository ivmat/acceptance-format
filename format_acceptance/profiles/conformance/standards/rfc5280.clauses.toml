[standard]
id         = "rfc5280"
title      = "RFC 5280 — Internet X.509 PKI Certificate and CRL Profile"
edition    = "2008-05"
provenance = "external"
slice      = true
slice_note = "the TBSCertificate/Certificate field family (§4.1, §4.1.1.x, §4.1.2.x incl. the two Time sub-clauses), the extensions family (§4.2, §4.2.1 and its members, §4.2.2 and its members) as one row each, plus §6 (path validation) and §7 (internationalized names) as normative rows this subject may later declare not-applicable — the clauses a DER certificate structure parser-validator can conform to, violate, or must declare out of scope for"
numbering  = "the standard's own clause numbers"

[[clause]]
id    = "RFC5280-4.1"
ref   = "§4.1"
title = "Certificate top-level ASN.1 SEQUENCE definition"
force = "definition"
side  = "both"

[[clause]]
id    = "RFC5280-4.1.1.1"
ref   = "§4.1.1.1"
title = "tbsCertificate field definition"
force = "definition"
side  = "both"

[[clause]]
id    = "RFC5280-4.1.1.2"
ref   = "§4.1.1.2"
title = "signatureAlgorithm must equal tbsCertificate signature field"
force = "shall"
side  = "both"

[[clause]]
id    = "RFC5280-4.1.1.3"
ref   = "§4.1.1.3"
title = "signatureValue field definition"
force = "definition"
side  = "both"

[[clause]]
id    = "RFC5280-4.1.2.1"
ref   = "§4.1.2.1"
title = "version field definition, DEFAULT v1 must be omitted"
force = "shall"
side  = "both"

[[clause]]
id    = "RFC5280-4.1.2.2"
ref   = "§4.1.2.2"
title = "serialNumber field definition and range"
force = "definition"
side  = "both"

[[clause]]
id    = "RFC5280-4.1.2.3"
ref   = "§4.1.2.3"
title = "signature field definition inside TBSCertificate"
force = "definition"
side  = "both"

[[clause]]
id    = "RFC5280-4.1.2.4"
