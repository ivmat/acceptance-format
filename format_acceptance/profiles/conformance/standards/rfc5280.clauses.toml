side  = "both"

[[clause]]
id    = "RFC5280-4.1.2.5"
ref   = "§4.1.2.5"
title = "CA selects UTCTime through 2049, GeneralizedTime after"
force = "shall"
side  = "encoder"

[[clause]]
id    = "RFC5280-4.1.2.5.1"
ref   = "§4.1.2.5.1"
title = "UTCTime representation: Zulu, seconds present, YY pivot 50"
force = "shall"
side  = "both"

[[clause]]
id    = "RFC5280-4.1.2.5.2"
ref   = "§4.1.2.5.2"
title = "GeneralizedTime representation: Zulu, seconds, no fraction"
force = "shall"
side  = "both"

