[standard]
id         = "rfc5915"
title      = "RFC 5915 (06/2010) — Elliptic Curve Private Key Structure"
edition    = "2010-06"
provenance = "external"
slice      = true
slice_note = "the single ECPrivateKey structural clause (§3) this crate's EC key parser can conform to or violate"
numbering  = "the standard's own clause numbers"

[[clause]]
id    = "RFC5915-3"
ref   = "§3"
title = "ECPrivateKey ASN.1 type definition, EXPLICIT tags"
force = "definition"
side  = "both"

# UNVERIFIED: RFC 5915 §3 has no lettered/numbered sub-clauses in the published text, as far as
# could be confirmed. The parameters CHOICE and publicKey BIT STRING both live inside this
# one clause; split them out only if a future revision needs finer addressing.