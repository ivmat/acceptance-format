# acceptance.toml — the acceptance-format's SELF-manifest.
#
# WHY THIS FILE EXISTS: a format for recording what verification decided should describe itself.
# Its escape from the self-reference circularity that invites is the format's own core mechanism:
# every claim below carries a runnable recipe (`self_verify.command` + `expect`) that the READER
# re-executes against their own checkout — trust in any claim here never rests on this manifest's
# own say-so about itself. See [[claim]] "SELF-NOTE" below for that relationship stated plainly.
#
# This is the first CERTIFICATE-grade manifest in this tree (`illustrative = false`, below): it is
# required to validate under `--strict --strict-weight`, the same flags a real subject's manifest
# must clear, with no exemption for being about this repo itself. Wired into the gate as step 9
# (`gates/run_all.sh`) so this self-description can never silently rot out of sync with the tools
# and spec it certifies.
#
# Every claim below is scoped to exactly what steps 1-8 of `gates/run_all.sh`'s 9 numbered steps
# mechanically decide about THIS repo's own tooling and artifacts (step 9 validates this manifest
# itself, so it cannot be a claim inside it) — nothing about whether the FORMAT's design is
# sound (that is `spec/core.md`'s own freeze-criterion ledger, a human judgment call the owner
# reserves), only whether the checkers and gates this repo ships actually do what they say.

[format]
id            = "acceptance/0"
shape         = "single-file"
spec_id       = "acceptance-format"
# spec_sha, validator_sha and [subject].commit all name the SAME commit (aeac93f22f15...) under the
# SELF-CERTIFICATION CONVENTION ruled in format.md's "`[format]` self-location" section: that commit
# is the CLEAN commit at which every evidence transcript below was captured, and whose spec and
# validator were the ones read. This manifest and its evidence/ records then land in the IMMEDIATELY
# FOLLOWING commit, whose diff is exactly this manifest-and-evidence update and nothing else. The
# one-commit lag is inherent to self-certification — a manifest cannot name a commit that already
# contains itself — so it is DISCLOSED here (and in evidence/self-reference-disclosure.txt), not
# carried as an owed re-stamp. Re-run the capture and re-stamp all three whenever the certified
# tooling changes; that is the convention, not a TODO left open.
spec_sha      = "aeac93f22f15f72d787970135d61ac97e19f4a8a"
validator_sha = "aeac93f22f15f72d787970135d61ac97e19f4a8a"
generated_by  = "hand-authored"
generated_at  = "2026-08-28T19:07:38Z"
illustrative  = false   # THE POINT of this file: it must validate as a CERTIFICATE, not a teaching
                        # example — core.md §0.6. --strict --strict-weight is run against it in
                        # gates/run_all.sh step 9, unconditionally.

[subject]
name   = "acceptance-format"
kind   = "tool"          # closest matching token in format.md's registry (rust-crate | rust-workspace
                          # | doc | tool | ml-model | dataset | spec | design | agent-output |
                          # other): this subject is a spec + a set of Python validator/gate tools,
                          # not a library crate, not a bare document either — "tool" fits the actual
                          # certified surface (the checkers) better than "spec" would.
commit = "aeac93f22f15f72d787970135d61ac97e19f4a8a"   # the CLEAN commit on rev-0.1-core-update at
                          # which every evidence transcript below was captured — the commit this
                          # manifest certifies, per the self-certification convention named in the
                          # [format] comment above. The following commit carries this file and its
                          # evidence/ records, and nothing else.
dirty  = false            # false, and checked: `git status --short` was empty at the commit named
                          # above, and every transcript below records that same HEAD. The manifest
                          # and evidence update that follows is a separate commit by the convention,
                          # not uncommitted work sitting on top of a dirty tree.
# subject_hash: DELIBERATELY OMITTED. format.md's `subject:` M11 domain is ratified and computable
# today only for the SINGLE-FILE case (tools/m11.py `digest_file("subject", path)`); this subject
# is a MULTI-FILE tree (the whole acceptance-format repo), whose bundle-root-style inventory hash
# is explicitly PENDING the same P12 canonical-emit work `bundle-root` itself defers to (format.md,
# "`subject:` domain" section, last paragraph). Recording a hand-rolled multi-file hash here would
# be inventing the exact P12 byte-serialization this repo's own spec says is not yet fixed — a
# disclosed absence, not an oversight, and not something to paper over with a placeholder value.

[spec]
# The governing text for these 8 claims is gates/run_all.sh itself: it is the one artifact that
# actually enumerates "what does this repo's own gate suite mechanically decide" — the axis below.
# This is NOT spec/core.md or spec/format.md directly (those define the FORMAT's rules; the claims
# below are about whether THIS REPO'S TOOLING correctly implements and enforces those rules, which
# is what steps 1-8 of gates/run_all.sh actually run).
path    = "gates/run_all.sh"
version = "aeac93f22f15f72d787970135d61ac97e19f4a8a"   # the same commit [subject].commit names,
                          # under the same self-certification convention
axis    = "steps 1-8 of the 9 numbered steps of gates/run_all.sh (each a mechanically-checked property of this repo's own validator/gate tooling, run against its own shipped artifacts) — step 9 validates this manifest itself and so cannot be a claim inside it — plus one unweighted self-reference disclosure about this manifest's own producer/verifier relationship"

[coverage]
clauses_total = 9   # the 8 claimable gate steps (steps 1-8 of the script's 9) + the 1
                    # self-reference disclosure clause (SELF-REF, below) — not part of the numbered
                    # gate-step axis, but a real clause this manifest speaks to, so it is counted
                    # rather than smuggled in as a 9th claim over an 8-clause axis (design rule 1:
                    # omission is the only forbidden state).
claims_total  = 9   # must equal len([[claim]]) below — checked by the validator, not asserted.

# =====================================================================================================
# -- step 1: tools/check_acceptance.py's own embedded fixture suite -----------------------------------
# =====================================================================================================

[[claim]]
id        = "SELF-1"
clause    = "RUN-ALL-1"
item      = "tools/check_acceptance.py::selftest"
statement = "tools/check_acceptance.py's own embedded fixture suite (210 named fixtures — a mix of fixtures that must validate cleanly and fixtures that must be REFUSED, e.g. a weighted claim with no clause_source) passes end-to-end"
band      = "A1"
status    = "evidenced"
weight    = "weighted"
grade     = "test-only"       # #[test]-shaped: 210 named concrete fixtures, each with a fixed
                              # expected outcome (pass/refuse). Not `mechanical`: there IS a
                              # behavioural oracle per fixture (does this exact input validate,
                              # and for the stated reason).
clause_source = "doc-comment"  # the clause text is gates/run_all.sh's own step-1 comment
                              # ("manifest validator selftest (tools/check_acceptance.py)");
                              # doc-comment, not spec-document, because that comment lives in a
                              # script, not in a prose spec file.

  [claim.self_verify]
  command = "python3 tools/check_acceptance.py --selftest"
  expect  = "SELFTEST PASS: 210 fixtures"

    [claim.self_verify.watched_fail]
    of_command = "python3 tools/check_acceptance.py --selftest"
    perturbed  = "disabled tools/check_acceptance.py's W2.3/P1 'clause_source not recorded' refusal (the `if cs is None:` branch inside the weighted-claim checks, line 1463) by changing it to `if cs is None and False:`, then re-ran the identical selftest command"
    observed   = "'SELFTEST FAIL: P1: weighted claim with NO clause_source is refused weight (--strict-weight): expected FAIL, but validation passed'; the run reported 'SELFTEST FAILED: 1/210 cases' and exited 1 — reverted immediately after, confirmed clean (SELFTEST PASS: 210 fixtures) with `git status --short tools/` showing no diff"
    date       = "2026-08-28"

  [[claim.evidence]]
  kind        = "unit-test"
  family      = "dynamic"
  method      = "unit-test"
  epistemic_tier = "T3"
  ref         = "check_acceptance.py::selftest (210 embedded fixtures)"
  result      = "pass"
  tool        = "python3@3.14.4 + check_acceptance.py@aeac93f22f15"
  cases       = 210
  record      = "evidence/step1-check-acceptance-selftest.txt"
  record_hash = "sha-512:108ade4ed716fae58668f7ff5e2f8a4601cdcca9bbf9ad72fea9286d34ab1ea8f0ca050998f7c98fc4e864bb5b594d35e86dfcde4fc3303bb8bb4d661516e32b"

  # the mutation control backing this claim's A1 band (assurance-bands.md rule 4: an oracle-bearing
  # dynamic-only claim needs a matching observed-red control to reach A1, never A2+). This record IS
  # the mutant run named in watched_fail above, captured as its own evidence record rather than only
  # narrated in prose.
  [[claim.evidence]]
  kind        = "unit-test"
  family      = "dynamic"
  method      = "unit-test"
  epistemic_tier = "T3"
  ref         = "check_acceptance.py::selftest (mutant: W2.3/P1 clause_source-required refusal disabled)"
  result      = "fail"
