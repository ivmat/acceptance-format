  cases       = 210
  record      = "evidence/step1-mutation-control-clause-source-check-disabled.txt"
  record_hash = "sha-512:b6af7f222868e6e8754ce131ce775d5035444cfa8278c2fb2b877c3a247a73744a03e8cc3c724a322006ce43e3c9fd829e2152a9a89822d8720428969b73360f"

    [claim.evidence.control]
