[package]
name = "raster-draw"
version = "0.1.0"
edition = "2021"
description = "A tiny pixel canvas and a midpoint-circle rasterizer, built on geom-math."
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "raster_draw"
path = "src/lib.rs"

[dependencies]
geom-math = { path = "../geom-math" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
