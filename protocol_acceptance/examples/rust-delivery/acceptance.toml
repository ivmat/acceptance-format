[[deviation]]
requirement      = "R5"
kind             = "unmet"
statement        = "R1/R2/R3 evidence is entirely bounded: R1/R2 rest on named test fixtures plus a 200-trial LCG-perturbed sample (dynamic, points not sets); R3 (probe grade) is a Kani proof bounded to inputs of at most 20 ASCII bytes, unwind=24 -- not the crate's real 34-byte capacity, and not an unbounded/kernel-checked argument. No unbounded argument exists for any of the three."
cause            = "No Lean/Aeneas extraction lane exists for this crate, and CBMC's own cost on this machine (measured: 29s/206s/415s at a 8/16/20-byte harness bound; did not finish within a 10-minute time-box unconstrained at the real 34-byte maximum) makes a full-length or genuinely unbounded Kani proof impractical within this delivery."
impact           = "Inputs longer than the tested/proved envelope are covered only by informal structural reasoning (uniform, length-bounded per-byte loops), not by a machine-checked argument. A crafted input outside the proved/tested range could in principle still misbehave, though nothing in the code's shape suggests one exists."
remedy           = "Extend the Kani harness's bound as CBMC/toolchain performance allows, or add a Lean/Aeneas extraction of validate's core loop for a genuinely unbounded proof. Target: before v2 (see the consumer decision's condition C1)."
waiver_requested = true

