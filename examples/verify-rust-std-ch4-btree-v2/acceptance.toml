[[claim]]
id        = "CH4-V13"
clause    = "Handle::insert_recursing (List-2 #2)"
item      = "alloc::collections::btree::node::Handle::<NodeRef<Mut,K,V,Leaf>,Edge>::insert_recursing"
statement = "memory safety of the recursive insert path at unbounded tree height"
band      = "A0"
status    = "gap"

# No evidence in this entry, and the gap is structural rather than incidental. insert_recursing's
# loop ascends from the insertion point to the root, so its trip count is the tree's HEIGHT -- the
# one axis the node type does not bound (occupancy is bounded by CAPACITY, a compile-time constant;
# height is bounded only by element count). Harnessing it at a fixed height is possible and was done
# during development, but a bounded-height result does not discharge the unboundedness the challenge
# states for this function, so nothing is claimed here rather than shipping a bound that would read
# stronger than it is. Measured at Kani 0.67.0 / CBMC 6.8.0.
