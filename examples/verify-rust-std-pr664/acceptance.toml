# Everything here is UNWEIGHTED (task instruction 2026-08-29: reduced/unweighted manifests are
# fine; do not overclaim to reach a weighted tier). Validate with:
#   python3 tools/check_acceptance.py --strict acceptance.toml   (public acceptance-format @ c8c00bb)

[format]
id            = "acceptance/0"
shape         = "single-file"
spec_id       = "acceptance-format"
# PUBLIC shas (ruling R-1: a pin in a public artifact must be resolvable by a public reader).
# This manifest ships in the public repo, so it pins the PUBLIC spec/validator commit
# c8c00bb08ce4. Earlier revisions of this example pinned bd1c995bd9ae, which is a commit in the
# private WORKING repo and does not resolve against github.com/ivmat/acceptance-format. The two
# are the same spec and the same validator -- verified byte-identical at spec/core.md,
# spec/assurance-bands.md and tools/check_acceptance.py -- so only the coordinate system changed,
# not the version being cited. (The sibling pr618 example still carries the private-repo pin; see
# this example's README note.)
spec_sha      = "c8c00bb08ce423e6b4f2403bf2f4f8029393b812"
validator_sha = "c8c00bb08ce423e6b4f2403bf2f4f8029393b812"
generated_by  = "hand-authored"
generated_at  = "2026-08-30T00:00:00Z"
illustrative  = true

[subject]
name   = "verify-rust-std (core::str::pattern, verify-rust-std challenge fork, Challenge 21)"
kind   = "rust-crate"
# PR model-checking/verify-rust-std#664's fork branch head: ivmat/verify-rust-std, branch
# challenge-21-nextback-probe. This manifest has been re-stamped twice, and both moves are
# recorded here rather than silently absorbed:
#   1ff965f7da5a  -- the private sha this manifest was originally authored against, pre-push.
#   4d26cf4c758b  -- the first public fork sha (byte-identical content to 1ff965f7da5a).
#   09a3d026f662  -- CURRENT. 4d26cf4c758b plus one formatting-only commit.
# The formatting commit exists because the repo's `upstream_test` CI job runs `./x fmt --check`
# inside a rust-lang/rust checkout, so the effective style config is that repo's rustfmt.toml
# (style_edition 2024, use_small_heuristics = "Max"); verify-rust-std carries no rustfmt.toml of
# its own, so a plain `cargo fmt` does not reproduce it. The change is line-wrapping only inside
# `pub mod verify`: no harness, assertion message, `kani::cover` string, bound, fixture or
# assumption differs between 4d26cf4c758b and 09a3d026f662. Every claim below was independently
# re-verified AT 09a3d026f662 (see the carrier record), so this manifest describes the sha it is
# stamped with rather than inheriting a result from an ancestor. The base it is extracted onto is
# upstream/main @ 43bd3b1bff2, unmodified.
commit = "09a3d026f66295f0dc7b976610c1d23e10c216cb"
dirty  = false

[spec]
