# -- the submitted PROBE: bounded, one fixed fixture -----------------------------------------------

[[claim]]
id        = "CH21-001"
clause    = "TWOWAY-NEXTBACK-SHORT-PERIOD"
item      = "library/core/src/str/pattern.rs::TwoWaySearcher::next_back"
statement = "next_back, driven through the real ReverseSearcher API against the UNMODIFIED shipped TwoWaySearcher (no #[cfg(kani)] body swap), is memory-safe per step, returns only sound Match slices, matches an independently-computed expected match (no silent miss), and reaches all five backward search-loop arms -- at one fixed short-period needle (\"abab\"), one fixed haystack length (5 bytes), the 3-symbol representative alphabet {a,b,z}, #[kani::unwind(6)]"
band      = "A3"
status    = "evidenced"
grade     = "probe"

  [[claim.evidence]]
  kind      = "kani-harness"
  family    = "bmc"
  method    = "kani-harness"
  epistemic_tier = "T2"
  ref       = "core::str::pattern::verify::check_twoway_search_back_arm_covers"
  result    = "pass"
  tool      = "kani@d4df833c8f8f"
  bounds    = "bounded: unwind=6, needle=\"abab\" fixed, haystack length=5 fixed, haystack content symbolic over {a,b,z}"
  semantics = "-Z function-contracts -Z mem-predicates -Z float-lib -Z c-ffi -Z loop-contracts -Z quantifiers -Z stubbing"
  # Re-verified AT the stamped sha 09a3d026f662: VERIFICATION:- SUCCESSFUL, 5 of 5 cover
  # properties satisfied, kani 0.67.0 @ d4df833 / CBMC 6.8.0. The earlier run at the
  # content-identical ancestor 4d26cf4c758b is at
  # cloud-campaigns/CH21-NEXTBACK-FOCUSED-2026-08-28/RECEIPT.md.
  record    = "cloud-campaigns/CH-FMTFIX-D0088-2026-08-30/RECEIPT.md"

  # negative control (assurance-bands.md rule 6): a soundness mutant of the shipped source
  # (off-by-one `match_pos` in the Match arm) run against THIS exact fixture -- VM-confirmed RED,
  # caught directly by the adjacency/slice-equality oracle.
  [[claim.evidence]]
  kind      = "kani-harness"
  family    = "bmc"
  method    = "kani-harness"
  epistemic_tier = "T2"
  ref       = "core::str::pattern::verify::check_twoway_search_back_arm_covers (mutant: off-by-one match_pos in the Match arm, TwoWaySearcher::next_back)"
  result    = "fail"
  tool      = "kani@d4df833c8f8f"
  bounds    = "bounded: unwind=6, needle=\"abab\" fixed, haystack length=5 fixed, haystack content symbolic over {a,b,z}"
  semantics = "-Z function-contracts -Z mem-predicates -Z float-lib -Z c-ffi -Z loop-contracts -Z quantifiers -Z stubbing; run against the pre-formatting content (see AS-4), which differs from the stamped sha only in line wrapping"
  record    = "cloud-campaigns/CH21-M1-2026-08-27/run.log"

    [claim.evidence.control]
    kind        = "mutation"
    expectation = "red"
    observed    = "red"
    of_claim    = "CH21-001"

  # -- disclosed scope limits and one disclosed evidence GAP (do not overclaim) --

  [[claim.assumes]]
  id        = "AS-1"
  statement = "coverage is exactly one fixed needle (\"abab\"), one fixed haystack length (5 bytes), and the 3-symbol representative alphabet {a,b,z} -- not any other needle, length, or the full byte/UTF-8 alphabet"
  void_if   = "this claim is read as covering any other needle, haystack length, or alphabet"

  [[claim.assumes]]
  id        = "AS-2"
  statement = "the bounded-completeness (no-miss) oracle's own negative control is NOT discriminating at this exact fixture size: exhaustive offline enumeration over all 3^5 possible haystacks found zero cases where the matching one-line completeness-defect mutation (an off-by-one in the right-part-mismatch fast-forward, `self.end -= self.period` vs `self.end -= self.period + 1`) diverges from the correct algorithm at haystack length 5. A VM-confirmed watched-fail witness for that completeness-defect class exists only on a different, unsubmitted sibling harness at a larger fixture (haystack length 6)"
  void_if   = "the completeness (no-miss) oracle on THIS submitted claim/fixture is read as having its own dedicated VM-confirmed watched-fail control"

  [[claim.assumes]]
  id        = "AS-4"
  statement = "the mutation control was run against the pre-formatting content, not against the stamped sha 09a3d026f662 itself; the two differ only in line wrapping inside `pub mod verify` (no harness, oracle, bound, cover string or fixture differs), so the control is treated as applying unchanged -- disclosed rather than left implicit"
  void_if   = "the formatting difference is ever shown to be more than whitespace, or the control is read as having been re-run at the stamped sha"

  [[claim.assumes]]
  id        = "AS-3"
  statement = "only the RejectAndMatch searcher instantiation is exercised; the MatchOnly backward path (next_match_back/rfind, where use_early_reject() == false takes genuinely different control flow) is not exercised by this harness"
  void_if   = "the 5-arm reachability result is read as applying to the MatchOnly instantiation"

