# (AtomicBool / AtomicI8 / AtomicI32 / AtomicU64 / AtomicPtr<u8> / AtomicPtr<[u8; 3]>).
# NOT a generated certificate: built by hand from the receipts in the sibling private
# control repo's `cloud-campaigns/` tree, not the output of a manifest generator.
# `illustrative = true` per core.md 0.6 makes that a validator-visible fact.
# `record` pointers are repo-relative to the private control repo they live in
# (not this repo); they will not resolve from a public reader's checkout -- expected, and
# validator-flagged as a WARN, not a FAIL (same shape as the ch20/ch21/ch22/ch4 examples this
# manifest is modeled on). Everything here is UNWEIGHTED.
#
# WHY illustrative = true:
#   1. Hand-authored, no automated capture pipeline behind these records.
#   2. Challenge 7's OWN Part 1 success criteria (doc/src/challenges/0007-atomic-types.md) ask for
#      SAFETY CONTRACTS written on each of TWELVE listed `from_ptr` methods, then verification that
#      each is safe for all pointee values given those preconditions. This manifest's 6 claims write
#      NO contract on ANY of the twelve -- they are assume-based PROBEs over 6 concrete type
#      instantiations. A PROBE does not count as criterion coverage. Part 2 (Safe Abstractions) and
#      Part 3 (Atomic Intrinsics) are entirely absent. Never read this manifest as satisfying Challenge 7 -- illustrative=true, the
#      [coverage] denominator/slice_note, and each claim's `statement` scoping are where that is
#      said, not just this header.
#
# BAND RATIONALE (assurance-bands.md):
#   - CH7-3 / CH7-4 / CH7-5 / CH7-6 (i32, u64, AtomicPtr<u8>, AtomicPtr<[u8;3]>): each carries a
#     dedicated alignment requires-ablation control, independently VM-confirmed RED against the
#     real shipped `from_ptr` -- carrier family is `bmc`, control kind is "ablation", and the claim
#     is memory safety on an UNSAFE surface. That matches assurance-bands.md's A2 species+control
#     requirement exactly ("memory safety on the unsafe surface" + control kind in
#     {mutation, ablation} on that surface) -> A2.
#   - CH7-1 / CH7-2 (bool, i8): `align_of::<AtomicBool>() == align_of::<AtomicI8>() == 1`
#     unconditionally, so the alignment assume excludes nothing and ALIGNMENT ablation cannot yield a
#     control for them -- not merely "not run". Other control shapes are conceivable in principle;
#     none was run. No observed-red control -> A0, per the one-sentence gate
#     ("an oracle-bearing claim cannot exceed A0 without an observed-red control whose `of_claim`
#     names it"). This follows the estate's existing conservative precedent for control-less
#     UB-freedom probes (ch4's *_no_ub claims and all four ch20 claims are A0).
#
#     *** FORMAT-SEMANTICS QUESTION FOR THE CONTROL SEAT (not self-ruled) ***
#     assurance-bands.md rule 6 carves out an exception: no-oracle hygiene / panic- and UB-freedom
#     claims "reach A1 without a control ... there is no postcondition oracle to mutate". CH7-1 and
#     CH7-2 are exactly that shape (UB-freedom only, no postcondition oracle) AND they carry a
#     terminal `kani::cover` non-vacuity witness, which is the thing A1's "non-vacuous but not
#     state-exhaustive" wording asks for. So a defensible reading puts them at A1, not A0.
#     They are recorded here at A0 because under-claiming is safe and over-claiming is not, and
#     because A0 matches existing estate precedent. If the control seat rules rule 6 applies, these
#     two lift to A1 with no other change. Routed, deliberately not decided by this lane.
