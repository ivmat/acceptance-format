# describes the branch at cf5fd23c45cb38273a314d6229a9b214a16ebf3c -- e7b1bc12 plus four commits that
# answer the maintainer review of 2026-08-16 (pre-state copy oracle with old(...), an overlapping
# non-uniform copy witness, u32 pointer-distance fixtures, the bounded arith_offset wrapper renamed
# to arith_offset_bounded_probe, separated initialization helpers, tightened residual comments).
# cf5fd23c differs from c35c201b (the commit the new evidence was captured at) by comments only.
#
# NOT a generated certificate: hand-authored from the PR's own body plus the producer's private
# repository's receipts, not the output of a manifest generator. `illustrative = true` (core.md 0.6)
# makes that a validator-visible fact.
#
# PROVENANCE OF THE PER-CLAIM RECORDS. The 15 intrinsic claims' evidence records (record =
# cloud-campaigns/CH2-K067-2026-08-29/RECEIPT.md) were captured at e7b1bc12 and carry
# captured_at_commit accordingly. Every harness they name was re-executed and passed in the
# whole-module run at c35c201b (intrinsics::verify, CI mode: 374 successfully verified harnesses,
# 0 failures; record = cloud-campaigns/CH2-FULL-2026-09-03/next-cells/pr618-obligations/carrier/
# artifacts/proofs/logs/wholemodule/ci.log) and again in the repository's own sharded suite at
# cf5fd23c (scripts/run-kani.sh, 4 Linux shards, 1436 harnesses, 0 failures). Those two runs are the
# re-verification that justifies the subject restamp; the per-claim records were NOT re-authored.
#
# BANDS. Every intrinsic claim (CH2-001..CH2-015) stays at band A0: each is a `kani-harness` proof of
# a bounded functional contract -- the A3 shape -- but no mutation control specific to that claim's
# oracle is filed as a citable machine record against it. Per assurance-bands.md rule 2/5 an
# oracle-bearing claim without a matching observed-red control is capped at A0. Under-claiming is
# the intended direction. ONE claim is above A0: CH2-029 (band A3), an ADDITIVE proposition about the
# copy_wrapper byte-value oracle, whose implementation mutation (the wrapper's forwarding call replaced
# by write_bytes) was observed red on the postcondition itself, in both dependency-contract modes.
# That control is the one the PR description's controls table reports. A3-COUNT PARTITION (binding
# house rule): production-intrinsic A3 = 0; wrapper/model-predicate A3 = 1. The band attaches to the
# proposition stated in the claim, never to the intrinsic's name: core::intrinsics::copy itself
# (CH2-004) remains A0. Further controls exist in the producer's private repository (pointer-distance
# precondition ablations, read_via_copy/write_via_move wrapper mutants); they are not transcribed here
# and lift nothing until they are.
#
# `record` pointers are repo-relative to the producer's private repository they live in (not this repo); they
# will not resolve from here or from a public reader's checkout -- expected, and validator-flagged as
# a WARN, not a FAIL (same shape as the rs-verified-der example).
#
# UNWEIGHTED throughout (house rule 2026-08-29): reduced/unweighted manifests are preferred over
# inflated ones. Validate with:
#   python3 tools/check_acceptance.py --strict examples/verify-rust-std-pr618/acceptance.toml

